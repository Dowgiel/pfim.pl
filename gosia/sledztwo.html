(function(){
'use strict';
var CSS = "\n.mk{all:initial;display:block;font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,\n 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#16181c;\n background:#f4f4f2;border:1px solid #c9ccc8;border-radius:3px;padding:0;margin:1.4em 0;\n box-sizing:border-box;overflow-x:clip}\n.mk *,.mk *::before,.mk *::after{box-sizing:border-box}\n.mk p,.mk h3,.mk h4,.mk ul,.mk ol,.mk li,.mk figure{margin:0;padding:0}\n.mk-glowa{background:#16181c;color:#f4f4f2;padding:14px 20px;display:flex;\n flex-wrap:wrap;gap:4px 14px;align-items:baseline}\n.mk-glowa .mk-nad{font-size:11px;letter-spacing:.14em;text-transform:uppercase;\n color:#e8a49f;font-weight:700}\n.mk-glowa h3{font-size:20px;font-weight:700;line-height:1.25;color:#f4f4f2;width:100%}\n.mk-cialo{padding:20px}\n.mk-cialo > * + *{margin-top:14px}\n.mk-lid{color:#4a4e55;max-width:62ch}\n.mk-zlec{border-left:3px solid #b4322b;background:#ecece9;padding:12px 16px}\n.mk-zlec .mk-od{font-size:11px;letter-spacing:.1em;text-transform:uppercase;\n color:#8c3029;font-weight:700;margin-bottom:5px}\n.mk-btn{display:inline-block;font:inherit;font-weight:600;color:#f4f4f2;background:#16181c;\n border:2px solid #16181c;border-radius:3px;padding:10px 18px;cursor:pointer;min-height:44px;\n text-align:center}\n.mk-btn:hover{background:#31353d;border-color:#31353d}\n.mk-btn:focus-visible{outline:3px solid #b4322b;outline-offset:2px}\n.mk-btn[aria-disabled=\"true\"]{background:#565b63;border-color:#565b63;cursor:not-allowed}\n.mk-btn2[aria-disabled=\"true\"]{background:#e3e3e0;color:#4a4e55;border-color:#7d838a}\n.mk-btn2{background:#f4f4f2;color:#16181c}\n.mk-btn2:hover{background:#e3e3e0}\n.mk-btny{display:flex;flex-wrap:wrap;gap:10px}\n.mk-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;\n clip:rect(0 0 0 0);white-space:nowrap;border:0}\n.mk-blok{border:1px solid #c9ccc8;background:#fbfbfa;padding:16px 18px;border-radius:3px}\n.mk-blok > * + *{margin-top:10px}\n.mk-blok h4{font-size:16px;font-weight:700}\n.mk-ok{border-left:4px solid #2c6a4c}\n.mk-uwaga{border-left:4px solid #b4322b}\n.mk-licz{font-size:13px;color:#4a4e55}\n.mk-mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:13px}\n.mk ul.mk-lista{list-style:none;display:flex;flex-direction:column;gap:8px}\n.mk ul.mk-lista > li{padding-left:18px;position:relative}\n.mk ul.mk-lista > li::before{content:'';position:absolute;left:0;top:.62em;\n width:7px;height:7px;background:#b4322b;border-radius:1px}\n@media (max-width:520px){.mk-cialo{padding:15px}.mk-glowa{padding:12px 15px}}\n.mk[hidden],.mk [hidden]{display:none!important}\n\n.mk-cel-reset:focus{outline:none}\n.mk-sekcja{font-size:17px;font-weight:700;border-bottom:2px solid #16181c;padding-bottom:6px}\n.mk-art{margin:0;border-left:4px solid #7d838a;background:#fbfbfa;padding:14px 16px;border-radius:3px}\n.mk-art > * + *{margin-top:8px}\n.mk-art-site{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#4a4e55;font-weight:700}\n.mk-art-head{font-size:17px;line-height:1.4}\n.mk-akcje{display:flex;flex-direction:column;gap:10px}\n.mk-akcja{border:1px solid #7d838a;border-radius:3px;background:#fff;overflow:hidden}\n.mk-abtn{display:block;width:100%;font:inherit;font-weight:600;text-align:left;background:#fff;\n border:0;border-left:4px solid #b4322b;padding:13px 15px;cursor:pointer;min-height:44px;color:#16181c}\n.mk-abtn:hover{background:#eef0ee}\n.mk-abtn:focus-visible{outline:3px solid #b4322b;outline-offset:-3px}\n.mk-abtn[aria-disabled=\"true\"]{background:#ecece9;border-left-color:#2c6a4c;cursor:default}\n.mk-abtn[aria-disabled=\"true\"]:hover{background:#ecece9}\n.mk-awynik{padding:13px 15px 15px;border-top:1px solid #c9ccc8;background:#fbfbfa;color:#31353d}\n.mk-awynik:focus{outline:none}\n.mk-dziennik{display:flex;flex-direction:column;gap:8px;padding-left:22px;margin:0}\n.mk-dziennik li{padding-left:4px}\n.mk-dziennik li strong{color:#16181c}\n.mk-vfs{border:0;padding:0;margin:0;min-width:0}\n.mk-vbtn{min-width:0;max-width:100%}\n.mk-blok:focus{outline:none}\n.mk-werd{font-weight:700}\n.mk-ok .mk-werd{color:#245a40}\n.mk-uwaga .mk-werd{color:#96261f}\n@media (max-width:520px){.mk-art{padding:12px 13px}}\n";
var D = {"nad": "Ćwiczenie · sprawdzanie źródła", "tytul": "Sprawdź źródło w nowych kartach", "lid": "Wymyślony artykuł z wymyślonej strony o zdrowiu. Sprawdzaj go krokami z panelu, obserwuj dziennik i wydaj werdykt, kiedy wyda się to zasadne. Werdykt wydany zbyt wcześnie dostanie wyjaśnienie, czego jeszcze brakuje, zamiast oceny trafności.", "art_site": "Portal „Bystre Zdrowie”, dział terapii naturalnych", "art_head": "Ekstrakt z korzenia niebieśnika reguluje cukier we krwi lepiej niż leki na receptę", "art_tekst": "Garść badań przeprowadzonych przez nasz zespół potwierdza: codzienna porcja ekstraktu z korzenia niebieśnika obniża poziom cukru we krwi skuteczniej niż leki stosowane na receptę. Odkrycie opisuje dr Ludwik Mirtowski, założyciel Instytutu Badań nad Niebieśnikiem, od lat zajmującego się naturalnymi metodami wsparcia metabolizmu. „To przełom, na który czekały tysiące pacjentów” — mówi dr Mirtowski. Instytut zaleca regularne stosowanie ekstraktu jako uzupełnienia codziennej diety.", "naglowek_akcje": "Co można sprawdzić", "naglowek_dziennik": "Dziennik sprawdzania", "dziennik_pusty": "Dziennik jest na razie pusty.", "naglowek_werdykt": "Twój werdykt", "akcje": [{"id": "dalej", "etyk": "Czytaj dalej tę stronę", "kierunek": "pion", "sift": null, "wynik": "Dalsza część artykułu chwali kolejne właściwości niebieśnika — lepszy sen, odporność, nastrój. Żadne z tych zdań nie ma przypisu: ani nazwy badania, ani liczby badanych osób, ani czasopisma. Na dole strony — odnośniki do innych tekstów tego samego autora, między innymi „Pięć ziół, o których milczy medycyna akademicka”.", "dziennik": "Same niepoparte niczym pochwały kolejnych właściwości, bez jednego odnośnika."}, {"id": "onas", "etyk": "Zakładka „O nas” na tej stronie", "kierunek": "pion", "sift": null, "wynik": "Zakładka „O nas” opisuje portal jako „niezależne źródło rzetelnej wiedzy o zdrowiu, tworzone przez pasjonatów naturalnych terapii”. Nie podano żadnych nazwisk redakcji, adresu ani numeru rejestrowego wydawcy. Strona pisze dobrze sama o sobie, ale nie odsyła do niczego, co dałoby się sprawdzić gdzie indziej.", "dziennik": "Sama, niesprawdzalna z zewnątrz deklaracja niezależności — bez jednego namiaru."}, {"id": "organizacja", "etyk": "Wyszukaj nazwę organizacji w sieci", "kierunek": "poprzek", "sift": "zrodlo", "wynik": "Wyszukiwarka pokazuje: stronę własną instytutu, ten sam artykuł przedrukowany na dwóch innych portalach o podobnym profilu i sklep internetowy z ekstraktem z niebieśnika. W stopce sklepu jako sprzedawcę wpisano spółkę „SuplementiQ Sp. z o.o.”. Żadna niezależna redakcja, uczelnia ani organizacja pacjencka nigdzie nie wspomina ani o instytucie, ani o niebieśniku.", "dziennik": "Poza własną stroną i sklepem (sprzedawca: „SuplementiQ Sp. z o.o.”) — żadnego niezależnego śladu w sieci."}, {"id": "autor", "etyk": "Sprawdź autora", "kierunek": "poprzek", "sift": "zrodlo", "wynik": "W Google Scholar nazwisko „Ludwik Mirtowski” prowadzi do trzech publikacji z lat 2011–2014 z zakresu inżynierii materiałowej — bez związku z żywieniem czy medycyną. Profilu w ORCID nie udaje się znaleźć. Dotychczasowy dorobek nie potwierdza kompetencji w dziedzinie, o której autor wypowiada się w artykule.", "dziennik": "Dorobek w Google Scholar z zupełnie innej dziedziny, żadnego profilu w ORCID."}, {"id": "rejestr", "etyk": "Sprawdź wpis w rejestrze", "kierunek": "poprzek", "sift": "zrodlo", "wynik": "Wyszukiwarka Krajowego Rejestru Sądowego nie zna podmiotu o nazwie „Instytut Badań nad Niebieśnikiem” — pod tą nazwą nie figuruje żaden zarejestrowany podmiot.", "dziennik": "„Instytut” nie figuruje jako osobny, zarejestrowany podmiot w KRS."}, {"id": "inni", "etyk": "Poszukaj, co piszą o tym inni", "kierunek": "poprzek", "sift": "pokrycie", "wynik": "Żaden ogólnopolski portal informacyjny, żadna poradnia dietetyczna ani towarzystwo naukowe nie piszą o niebieśniku ani o instytucie, który go bada. Jedyne wzmianki poza „Bystrym Zdrowiem” to przedruki tego samego tekstu i oferty sklepów sprzedających ten sam ekstrakt.", "dziennik": "Zero niezależnego pokrycia tematu — same przedruki i oferty sklepowe."}], "werdykty": [{"typ": "tak", "etyk": "Temu źródłu można w tej sprawie ufać"}, {"typ": "nie", "etyk": "Nie można"}, {"typ": "malo", "etyk": "Za mało danych"}], "prog_poprzek": 2, "czego_uczy": "Czego uczy to ćwiczenie: samo uważne czytanie ocenianej strony, choćby najdokładniejsze, nie zastąpi wyjścia poza nią. Liczą się kroki „w poprzek” — te, które prowadzą do źródeł niezależnych od strony, którą się ocenia."};
function ensure(){
  var w = document.getElementById('mk-sledztwo') || document.querySelector('.mk-sledztwo');
  if(!w) return null;
  w.id='mk-sledztwo'; w.className='mk mk-sledztwo';
  return w;
}
function stylKiedys(){
  if(document.querySelector('style[data-mk="mk-sledztwo"]')) return;
  var st=document.createElement('style');
  st.setAttribute('data-mk','mk-sledztwo');
  st.appendChild(document.createTextNode(CSS));
  (document.head||document.documentElement).appendChild(st);
}
function el(t,k,tx){var e=document.createElement(t); if(k) e.className=k;
  if(tx!==undefined && tx!==null) e.textContent=tx; return e;}
function glowa(root){
  var g=el('div','mk-glowa');
  if(D.nad){var n=el('p','mk-nad',D.nad); g.appendChild(n);}
  g.appendChild(el('h3',null,D.tytul));
  root.appendChild(g);
  var c=el('div','mk-cialo'); root.appendChild(c); return c;
}
function zlecenie(c){
  if(!D.zlecenie) return;
  var z=el('div','mk-zlec');
  z.appendChild(el('p','mk-od', D.zlecenie.od || 'Zlecenie z redakcji'));
  z.appendChild(el('p',null, D.zlecenie.tresc));
  c.appendChild(z);
}

function buduj(c, root){
  c.appendChild(el('p','mk-lid', D.lid));

  var cel = el('h4','mk-sekcja mk-cel-reset', 'Materiał do sprawdzenia');
  cel.setAttribute('tabindex','-1');
  c.appendChild(cel);

  var art = document.createElement('blockquote');
  art.className = 'mk-art';
  art.appendChild(el('p','mk-art-site', D.art_site));
  var head = el('p','mk-art-head');
  head.appendChild(el('strong', null, D.art_head));
  art.appendChild(head);
  art.appendChild(el('p', null, D.art_tekst));
  c.appendChild(art);

  c.appendChild(el('h4','mk-sekcja', D.naglowek_akcje));
  var akcjeWrap = el('div','mk-akcje');
  c.appendChild(akcjeWrap);

  var licz = el('p','mk-licz');
  c.appendChild(licz);

  c.appendChild(el('h4','mk-sekcja', D.naglowek_dziennik));
  var dziennik = document.createElement('ol');
  dziennik.className = 'mk-dziennik';
  c.appendChild(dziennik);
  var pusty = el('p','mk-licz', D.dziennik_pusty);
  c.appendChild(pusty);
  var glos = el('p','mk-sr');
  glos.setAttribute('role','status');
  c.appendChild(glos);

  var stan = { krokow: 0, pion: 0, poprzek: 0, sift: {} };

  function licznik(){
    licz.textContent = 'Kroków w dzienniku: ' + stan.krokow + ' z ' + D.akcje.length + '.';
  }
  licznik();

  function dodajDoDziennika(akcja){
    if(wynikWerdykt){ wynikWerdykt.hidden = true; }
    if(pusty.parentNode){ pusty.parentNode.removeChild(pusty); }
    var li = document.createElement('li');
    var s = document.createElement('strong');
    s.textContent = akcja.etyk + '.';
    li.appendChild(s);
    li.appendChild(document.createTextNode(' ' + akcja.dziennik));
    dziennik.appendChild(li);
    stan.krokow++;
    if(akcja.kierunek === 'pion'){ stan.pion++; } else { stan.poprzek++; }
    if(akcja.sift){ stan.sift[akcja.sift] = true; }
    licznik();
    glos.textContent = 'Dodano do dziennika: ' + akcja.etyk + '.';
  }

  D.akcje.forEach(function(akcja, i){
    var pole = el('div','mk-akcja');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mk-abtn';
    btn.setAttribute('aria-disabled','false');
    btn.setAttribute('aria-expanded','false');
    var tid = 'mk-aw-' + i;
    btn.setAttribute('aria-controls', tid);
    var txt = el('span','mk-atxt', akcja.etyk);
    btn.appendChild(txt);
    pole.appendChild(btn);

    var rev = el('div','mk-awynik', akcja.wynik);
    rev.id = tid;
    rev.hidden = true;
    rev.setAttribute('tabindex','-1');
    pole.appendChild(rev);

    btn.addEventListener('click', function(){
      if(btn.getAttribute('aria-disabled') === 'true'){ return; }
      btn.setAttribute('aria-disabled','true');
      btn.setAttribute('aria-expanded','true');
      txt.appendChild(document.createTextNode(' — krok wykonany'));
      rev.hidden = false;
      dodajDoDziennika(akcja);
      rev.focus();
    });
    akcjeWrap.appendChild(pole);
  });

  c.appendChild(el('h4','mk-sekcja', D.naglowek_werdykt));
  var fs = document.createElement('fieldset');
  fs.className = 'mk-vfs';
  var lg = document.createElement('legend');
  lg.className = 'mk-sr';
  lg.textContent = D.naglowek_werdykt;
  fs.appendChild(lg);
  var vbtny = el('div','mk-btny');
  fs.appendChild(vbtny);
  c.appendChild(fs);

  var wynikWerdykt = el('div','mk-blok');
  wynikWerdykt.hidden = true;
  wynikWerdykt.setAttribute('tabindex','-1');
  c.appendChild(wynikWerdykt);

  function opisSift(){
    var wiersze = [];
    wiersze.push('Stop — zatrzymanie się przed wiarą na słowo: odbyło się już przez sam fakt sprawdzania, '
      + 'zamiast uwierzenia nagłówkowi wprost.');
    wiersze.push(stan.sift.zrodlo
      ? 'Investigate the source — wykonano: sprawdzono organizację, autora albo rejestr.'
      : 'Investigate the source — pominięto: nie sprawdzono ani organizacji, ani autora, ani rejestru.');
    wiersze.push(stan.sift.pokrycie
      ? 'Find better coverage — wykonano: poszukano, co piszą inni.'
      : 'Find better coverage — pominięto: nie poszukano, co piszą o tym inni.');
    wiersze.push('Trace claims — bez punktu zaczepienia: artykuł nie wskazuje żadnego konkretnego badania '
      + 'ani danych, do których dałoby się wrócić. Brak śladu do prześledzenia to osobny sygnał '
      + 'ostrzegawczy.');
    return wiersze;
  }

  function opisLateralne(){
    if(stan.poprzek > 0 && stan.pion === 0){
      return 'W tej ścieżce ani jeden krok nie został na samej stronie — to droga, którą w jednym badaniu '
        + '(Wineburg i McGrew) obierały osoby zawodowo weryfikujące fakty: od razu poza stronę.';
    }
    if(stan.poprzek > 0 && stan.pion > 0){
      return 'Część kroków w tej ścieżce została na stronie, część wyszła poza nią. Jedno badanie (Wineburg '
        + 'i McGrew) pokazało, że to właśnie wyjście poza stronę — a nie kolejna lektura jej samej — dawało '
        + 'osobom zawodowo weryfikującym fakty szybsze i trafniejsze oceny niż historykom i historyczkom czy studentom i studentkom.';
    }
    return 'W tej ścieżce nie padł żaden krok poza samą stroną. Jedno badanie (Wineburg i McGrew) pokazało '
      + 'dokładnie odwrotną drogę u osób zawodowo weryfikujących fakty: od razu poza stronę, zamiast kolejnej '
      + 'lektury jej samej.';
  }

  D.werdykty.forEach(function(w){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'mk-btn mk-btn2 mk-vbtn';
    b.textContent = w.etyk;
    b.addEventListener('click', function(){ pokazWerdykt(w.typ); });
    vbtny.appendChild(b);
  });

  function pokazWerdykt(typ){
    wynikWerdykt.innerHTML = '';
    wynikWerdykt.hidden = false;

    if(stan.poprzek < D.prog_poprzek){
      wynikWerdykt.className = 'mk-blok mk-uwaga';
      var czegoBrak;
      if(stan.krokow === 0){
        czegoBrak = 'Dziennik sprawdzania jest pusty — nie sprawdzono jeszcze niczego. Bez sprawdzenia '
          + 'czegokolwiek każdy werdykt jest zgadywaniem.';
      } else if(stan.poprzek === 0){
        czegoBrak = 'Dotychczasowe kroki (' + stan.krokow + ') zostały na tej samej stronie. Strona może '
          + 'napisać o sobie, co zechce — bez wyjścia poza nią (inna karta, inne źródło) nie da się tego '
          + 'sprawdzić.';
      } else {
        czegoBrak = 'Sprawdzono dopiero jeden krok poza stroną.';
      }
      var brakuje = D.prog_poprzek - stan.poprzek;
      wynikWerdykt.appendChild(el('p','mk-werd','Zbyt wcześnie na werdykt.'));
      wynikWerdykt.appendChild(el('p', null, czegoBrak + ' Warto sprawdzić jeszcze co najmniej ' + brakuje
        + ' ' + (brakuje === 1 ? 'krok' : 'kroki') + ' poza tą stroną, zanim padnie ocena.'));
      wynikWerdykt.focus();
      return;
    }

    var trafny = (typ === 'nie');
    wynikWerdykt.className = 'mk-blok ' + (trafny ? 'mk-ok' : 'mk-uwaga');
    wynikWerdykt.appendChild(el('p','mk-werd',
      trafny ? 'Trafny werdykt.' : 'Zebrane ślady wskazują na coś innego.'));

    if(typ === 'tak'){
      wynikWerdykt.appendChild(el('p', null, 'Strona chwali sama siebie, autor nie ma dorobku w tej '
        + 'dziedzinie, „instytut” nie figuruje jako osobny podmiot w KRS, a sklep sprzedający opisywany '
        + 'produkt należy do spółki „SuplementiQ” — i nikt niezależny o całej sprawie nie pisze. Osobno '
        + 'żaden z tych śladów nie musi jeszcze przesądzać sprawy — razem są mocnym powodem, żeby nie '
        + 'ufać.'));
    } else if(typ === 'malo'){
      wynikWerdykt.appendChild(el('p', null, '„Za mało danych” bywa uczciwą odpowiedzią — ale w tej sprawie '
        + 'da się zebrać kilka niezależnych od siebie tropów i wszystkie wskazują to samo: samochwalcza strona '
        + 'o sobie, autor bez dorobku w tym temacie, „instytut” bez własnego wpisu w KRS, sklep z '
        + 'produktem należący do spółki „SuplementiQ” i zero niezależnego pokrycia. W pewnym momencie to '
        + 'już wystarczy, żeby zdecydować.'));
    } else {
      wynikWerdykt.appendChild(el('p', null, 'Żaden z tropów, które da się tu zebrać, nie działa na korzyść strony: sama '
        + 'siebie chwali, autor bez dorobku w tym temacie, „instytut” bez własnego wpisu w KRS, sklep '
        + 'z produktem należący do spółki „SuplementiQ”, zero niezależnego pokrycia tematu.'));
    }

    wynikWerdykt.appendChild(el('p','mk-mono', 'Kroków w dzienniku: ' + stan.krokow + '. W pionie (na '
      + 'tej samej stronie): ' + stan.pion + '. W poprzek (poza stroną): ' + stan.poprzek + '.'));

    var siftNag = el('p', null);
    var siftS = document.createElement('strong');
    siftS.textContent = 'Ta ścieżka a cztery ruchy SIFT:';
