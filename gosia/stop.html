<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ćwiczenie: Zatrzymaj się i pomyśl</title>
<link rel="stylesheet" href="zasoby/cwiczenie.css">
</head>
<body>
<main class="cw">
<p class="cw-kurs">Myślenie krytyczne, czyli jak nie ulegać manipulacji</p>
<h1>Ćwiczenie: Zatrzymaj się i pomyśl</h1>
<div class="mk mk-stop" id="mk-stop">Ćwiczenie „Zatrzymaj się i pomyśl”. Jeśli się nie wczyta, włącz JavaScript.</div>
<script>
// <![CDATA[
(function(){
'use strict';
var CSS = "\n.mk{all:initial;display:block;font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,\n 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#16181c;\n background:#f4f4f2;border:1px solid #c9ccc8;border-radius:3px;padding:0;margin:1.4em 0;\n box-sizing:border-box;overflow-x:clip}\n.mk *,.mk *::before,.mk *::after{box-sizing:border-box}\n.mk p,.mk h3,.mk h4,.mk ul,.mk ol,.mk li,.mk figure{margin:0;padding:0}\n.mk-glowa{background:#16181c;color:#f4f4f2;padding:14px 20px;display:flex;\n flex-wrap:wrap;gap:4px 14px;align-items:baseline}\n.mk-glowa .mk-nad{font-size:11px;letter-spacing:.14em;text-transform:uppercase;\n color:#e8a49f;font-weight:700}\n.mk-glowa h3{font-size:20px;font-weight:700;line-height:1.25;color:#f4f4f2;width:100%}\n.mk-cialo{padding:20px}\n.mk-cialo > * + *{margin-top:14px}\n.mk-lid{color:#4a4e55;max-width:62ch}\n.mk-zlec{border-left:3px solid #b4322b;background:#ecece9;padding:12px 16px}\n.mk-zlec .mk-od{font-size:11px;letter-spacing:.1em;text-transform:uppercase;\n color:#8c3029;font-weight:700;margin-bottom:5px}\n.mk-btn{display:inline-block;font:inherit;font-weight:600;color:#f4f4f2;background:#16181c;\n border:2px solid #16181c;border-radius:3px;padding:10px 18px;cursor:pointer;min-height:44px;\n text-align:center}\n.mk-btn:hover{background:#31353d;border-color:#31353d}\n.mk-btn:focus-visible{outline:3px solid #b4322b;outline-offset:2px}\n.mk-btn[aria-disabled=\"true\"]{background:#565b63;border-color:#565b63;cursor:not-allowed}\n.mk-btn2[aria-disabled=\"true\"]{background:#e3e3e0;color:#4a4e55;border-color:#7d838a}\n.mk-btn2{background:#f4f4f2;color:#16181c}\n.mk-btn2:hover{background:#e3e3e0}\n.mk-btny{display:flex;flex-wrap:wrap;gap:10px}\n.mk-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;\n clip:rect(0 0 0 0);white-space:nowrap;border:0}\n.mk-blok{border:1px solid #c9ccc8;background:#fbfbfa;padding:16px 18px;border-radius:3px}\n.mk-blok > * + *{margin-top:10px}\n.mk-blok h4{font-size:16px;font-weight:700}\n.mk-ok{border-left:4px solid #2c6a4c}\n.mk-uwaga{border-left:4px solid #b4322b}\n.mk-licz{font-size:13px;color:#4a4e55}\n.mk-mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:13px}\n.mk ul.mk-lista{list-style:none;display:flex;flex-direction:column;gap:8px}\n.mk ul.mk-lista > li{padding-left:18px;position:relative}\n.mk ul.mk-lista > li::before{content:'';position:absolute;left:0;top:.62em;\n width:7px;height:7px;background:#b4322b;border-radius:1px}\n@media (max-width:520px){.mk-cialo{padding:15px}.mk-glowa{padding:12px 15px}}\n.mk[hidden],.mk [hidden]{display:none!important}\n\n.mk-fs{border:1px solid #c9ccc8;border-radius:3px;padding:14px 16px;background:#fbfbfa;margin:0}\n.mk-nagbox{border-left:4px solid #16181c}\n.mk-etyk{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#4a4e55;font-weight:700}\n.mk-nag{font-size:19px;font-weight:700;line-height:1.35}\n.mk-pyt{font-weight:600;margin-bottom:11px;line-height:1.4}\n.mk-skala{display:flex;flex-direction:column;gap:7px}\n.mk-opcja{display:flex;align-items:center;gap:10px;border:1px solid #7d838a;border-radius:3px;\n padding:9px 12px;cursor:pointer;background:#fff;min-height:44px}\n.mk-opcja:hover{background:#eef0ee}\n.mk-opcja:has(.mk-radio:checked){border-color:#16181c;border-width:2px;padding:8px 11px}\n.mk-opcja:focus-within{outline:3px solid #b4322b;outline-offset:2px}\n.mk-czeka{background:#ecece9;border-style:dashed;cursor:not-allowed;color:#4a4e55}\n.mk-radio{width:18px;height:18px;accent-color:#b4322b;margin:0;flex:none}\n.mk-strefa{display:flex;flex-direction:column;gap:14px}\n.mk-strefa:empty{display:none}\n.mk-zegar{font-weight:700;font-variant-numeric:tabular-nums;color:#8c3029;margin-bottom:10px}\n.mk-zegar-ok{color:#245a40}\n.mk-przyp{font-style:italic;color:#31353d}\n";
var D = {"nad": "Ćwiczenie · pauza przed reakcją", "tytul": "Zatrzymaj się i pomyśl", "naglowek": "Miasto wyda 12 milionów na ścieżki rowerowe zamiast na remont szpitala", "krok1": "Masz przed sobą nagłówek. Jaka jest Twoja pierwsza reakcja — ta, którą czujesz teraz, zanim cokolwiek sprawdzisz?", "reakcje": ["To skandal, trzeba to nagłośnić", "Brzmi podejrzanie, ale nie wiem", "Pewnie jest w tym jakiś haczyk"], "czekaj_info": "Teraz przeczytaj cały tekst. Przycisk odblokuje się po piętnastu sekundach — tyle mniej więcej zajmuje uczciwe przeczytanie takiej notatki.", "tekst": ["Rada miasta przyjęła budżet na przyszły rok. Na budowę ścieżek rowerowych przeznaczono 12 milionów złotych — środki pochodzą z unijnego programu transportu niskoemisyjnego i nie mogą być wydane na inny cel.", "Remont szpitala powiatowego finansowany jest z odrębnego źródła i został ujęty w wieloletniej prognozie finansowej na kwotę 40 milionów złotych, z terminem rozpoczęcia w drugim kwartale.", "Oba zadania nie konkurowały ze sobą w głosowaniu — znalazły się w różnych częściach budżetu."], "odliczanie": "Możesz odpowiedzieć za {0} s", "gotowe": "Teraz możesz odpowiedzieć", "krok2": "Po przeczytaniu tekstu: czy nagłówek oddawał to, co jest w treści?", "odp2": [["nie", "Nie — sugerował wybór, którego nie było"], ["czesc", "Częściowo — liczby się zgadzają, ale zestawienie wprowadza w błąd"], ["tak", "Tak — nagłówek był uczciwy"]], "domkniecie": {"tytul": "Co się przed chwilą wydarzyło", "tresc": ["Nagłówek nie zawierał ani jednego kłamstwa. Obie liczby są prawdziwe, obie sprawy rzeczywiście były w budżecie. Zabieg polega na jednym słowie: **zamiast**. Ono tworzy wybór, którego nie było — pieniądze z programu unijnego nie mogły trafić na szpital.", "Ten chwyt nazywa się **fałszywą alternatywą**. Jest skuteczny, bo nie wymaga kłamstwa, więc zawsze można powiedzieć: „przecież wszystko się zgadza”.", "I rzecz najważniejsza dla tego ćwiczenia: między Twoją pierwszą a drugą odpowiedzią nie zmieniły się żadne fakty. Zmieniło się to, że minęło piętnaście sekund poświęconych na przeczytanie tekstu. Tyle kosztuje odpowiedzialność, o której pisała Arendt."]}, "zmiana": "Twoja pierwsza reakcja: „{0}”.", "sekundy": 15};
function ensure(){
  var w = document.getElementById('mk-stop') || document.querySelector('.mk-stop');
  if(!w) return null;
  w.id='mk-stop'; w.className='mk mk-stop';
  return w;
}
function stylKiedys(){
  if(document.querySelector('style[data-mk="mk-stop"]')) return;
  var st=document.createElement('style');
  st.setAttribute('data-mk','mk-stop');
  st.appendChild(document.createTextNode(CSS));
  (document.head||document.documentElement).appendChild(st);
}
function el(t,k,tx){var e=document.createElement(t); if(k) e.className=k;
  if(tx!==undefined && tx!==null) e.textContent=tx; return e;}
function glowa(root){
  var g=el('div','mk-glowa');
  if(D.nad){var n=el('p','mk-nad',D.nad); g.appendChild(n);}
  g.appendChild(el('h3',null,D.tytul));
  root.appendChild(g);
  var c=el('div','mk-cialo'); root.appendChild(c); return c;
}
function zlecenie(c){
  if(!D.zlecenie) return;
  var z=el('div','mk-zlec');
  z.appendChild(el('p','mk-od', D.zlecenie.od || 'Zlecenie z redakcji'));
  z.appendChild(el('p',null, D.zlecenie.tresc));
  c.appendChild(z);
}

function buduj(c, root){
  var stan = {pierwsza:null};
  var glos = el('p','mk-sr'); glos.setAttribute('role','status'); c.appendChild(glos);

  var kartaN = el('div','mk-blok mk-nagbox');
  kartaN.appendChild(el('p','mk-etyk','Nagłówek z serwisu'));
  kartaN.appendChild(el('p','mk-nag', '„' + D.naglowek + '”'));
  c.appendChild(kartaN);

  // --- krok 1: odruch
  var fs1=document.createElement('fieldset'); fs1.className='mk-fs';
  var lg1=document.createElement('legend'); lg1.className='mk-sr'; lg1.textContent=D.krok1;
  fs1.appendChild(lg1);
  var h1=el('p','mk-pyt'); h1.setAttribute('aria-hidden','true'); h1.textContent=D.krok1;
  fs1.appendChild(h1);
  var box1=el('div','mk-skala');
  D.reakcje.forEach(function(r,i){
    var id='mk-r'+i;
    var lab=document.createElement('label'); lab.className='mk-opcja'; lab.setAttribute('for',id);
    var inp=document.createElement('input');
    inp.type='radio'; inp.name='mk-reak'; inp.id=id; inp.value=r; inp.className='mk-radio';
    lab.appendChild(inp); lab.appendChild(el('span',null,r));
    inp.addEventListener('change', function(){ stan.pierwsza=r; etapDrugi(); });
    box1.appendChild(lab);
  });
  fs1.appendChild(box1); c.appendChild(fs1);

  var strefa=el('div','mk-strefa'); c.appendChild(strefa);

  function etapDrugi(){
    if(document.getElementById('mk-tekst')) return;
    var info=el('p','mk-lid',D.czekaj_info); info.id='mk-info'; strefa.appendChild(info);
    var b=el('div','mk-blok'); b.id='mk-tekst';
    b.appendChild(el('h4',null,'Pełny tekst notatki'));
    D.tekst.forEach(function(t){ b.appendChild(el('p',null,t)); });
    strefa.appendChild(b);

    var fs2=document.createElement('fieldset'); fs2.className='mk-fs'; fs2.id='mk-fs2';
    var lg2=document.createElement('legend'); lg2.className='mk-sr'; lg2.textContent=D.krok2;
    fs2.appendChild(lg2);
    var h2=el('p','mk-pyt'); h2.setAttribute('aria-hidden','true'); h2.textContent=D.krok2;
    fs2.appendChild(h2);
    var zegar=el('p','mk-zegar'); zegar.id='mk-zegar';
    zegar.setAttribute('role','timer'); zegar.setAttribute('aria-live','off');
    fs2.appendChild(zegar);
    var box2=el('div','mk-skala'); box2.id='mk-box2';
    D.odp2.forEach(function(par,i){
      var id='mk-d'+i;
      var lab=document.createElement('label'); lab.className='mk-opcja mk-czeka';
      lab.setAttribute('for',id);
      var inp=document.createElement('input');
      inp.type='radio'; inp.name='mk-druga'; inp.id=id; inp.value=par[0]; inp.className='mk-radio';
      inp.setAttribute('aria-disabled','true');
      lab.appendChild(inp); lab.appendChild(el('span',null,par[1]));
      inp.addEventListener('change', function(){
        if(inp.getAttribute('aria-disabled')==='true'){ inp.checked=false;
          glos.textContent='Przeczytaj tekst. Odpowiedź odblokuje się za chwilę.'; return; }
        domknij();
      });
      box2.appendChild(lab);
    });
    fs2.appendChild(box2); strefa.appendChild(fs2);

    var zostalo = D.sekundy;
    zegar.textContent = D.odliczanie.split('{0}').join(String(zostalo));
    var t = setInterval(function(){
      zostalo--;
      if(zostalo > 0){ zegar.textContent = D.odliczanie.split('{0}').join(String(zostalo)); return; }
      clearInterval(t);
      zegar.textContent = D.gotowe;
      zegar.className = 'mk-zegar mk-zegar-ok';
      [].forEach.call(box2.querySelectorAll('input'), function(x){ x.setAttribute('aria-disabled','false'); });
      [].forEach.call(box2.querySelectorAll('label'), function(x){ x.className='mk-opcja'; });
      glos.textContent = D.gotowe + '. Możesz wybrać odpowiedź.';
    }, 1000);
  }

  function domknij(){
    if(document.getElementById('mk-dom')) return;
    var U=D.domkniecie;
    var b=el('div','mk-blok mk-uwaga'); b.id='mk-dom'; b.setAttribute('tabindex','-1');
    var echo=el('p','mk-sr'); echo.setAttribute('data-echo','1');
    echo.textContent = D.zmiana.split('{0}').join(stan.pierwsza || '(bez odpowiedzi)');
    b.appendChild(echo);
    b.appendChild(el('h4',null,U.tytul));
    if(stan.pierwsza){
      var pp=el('p','mk-przyp'); pp.setAttribute('aria-hidden','true');
      pp.textContent = D.zmiana.split('{0}').join(stan.pierwsza);
      b.appendChild(pp);
    }
    U.tresc.forEach(function(a){
      var p=el('p');
      a.split('**').forEach(function(cz,i){
        if(i%2){ var s=document.createElement('strong'); s.textContent=cz; p.appendChild(s); }
        else p.appendChild(document.createTextNode(cz));
      });
      b.appendChild(p);
    });
    strefa.appendChild(b); b.focus();
  }
}

function start(){
  var root=ensure();
  if(!root || root.getAttribute('data-mk-init')) return;
  root.setAttribute('data-mk-init','1');
  root.setAttribute('lang','pl');
  stylKiedys();
  root.innerHTML='';
  var c=glowa(root);
  zlecenie(c);
  buduj(c, root);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
else start();
})();
// ]]>
</script>
</main>
</body>
</html>
