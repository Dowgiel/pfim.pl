<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ćwiczenie: Twoja bańka</title>

</head>
<body>
<main class="cw">
<p class="cw-kurs">Myślenie krytyczne, czyli jak nie ulegać manipulacji</p>
<h1>Ćwiczenie: Twoja bańka</h1>
<div class="mk mk-banka" id="mk-banka">Ćwiczenie „Twoja bańka” — sześć pytań o własne źródła informacji. Jeśli się nie wczyta, włącz JavaScript.</div>
<script>
// <![CDATA[
(function(){
'use strict';
var CSS = "\n.mk{all:initial;display:block;font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,\n 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#16181c;\n background:#f4f4f2;border:1px solid #c9ccc8;border-radius:3px;padding:0;margin:1.4em 0;\n box-sizing:border-box;overflow-x:clip}\n.mk *,.mk *::before,.mk *::after{box-sizing:border-box}\n.mk p,.mk h3,.mk h4,.mk ul,.mk ol,.mk li,.mk figure{margin:0;padding:0}\n.mk-glowa{background:#16181c;color:#f4f4f2;padding:14px 20px;display:flex;\n flex-wrap:wrap;gap:4px 14px;align-items:baseline}\n.mk-glowa .mk-nad{font-size:11px;letter-spacing:.14em;text-transform:uppercase;\n color:#e8a49f;font-weight:700}\n.mk-glowa h3{font-size:20px;font-weight:700;line-height:1.25;color:#f4f4f2;width:100%}\n.mk-cialo{padding:20px}\n.mk-cialo > * + *{margin-top:14px}\n.mk-lid{color:#4a4e55;max-width:62ch}\n.mk-zlec{border-left:3px solid #b4322b;background:#ecece9;padding:12px 16px}\n.mk-zlec .mk-od{font-size:11px;letter-spacing:.1em;text-transform:uppercase;\n color:#8c3029;font-weight:700;margin-bottom:5px}\n.mk-btn{display:inline-block;font:inherit;font-weight:600;color:#f4f4f2;background:#16181c;\n border:2px solid #16181c;border-radius:3px;padding:10px 18px;cursor:pointer;min-height:44px;\n text-align:center}\n.mk-btn:hover{background:#31353d;border-color:#31353d}\n.mk-btn:focus-visible{outline:3px solid #b4322b;outline-offset:2px}\n.mk-btn[aria-disabled=\"true\"]{background:#565b63;border-color:#565b63;cursor:not-allowed}\n.mk-btn2[aria-disabled=\"true\"]{background:#e3e3e0;color:#4a4e55;border-color:#7d838a}\n.mk-btn2{background:#f4f4f2;color:#16181c}\n.mk-btn2:hover{background:#e3e3e0}\n.mk-btny{display:flex;flex-wrap:wrap;gap:10px}\n.mk-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;\n clip:rect(0 0 0 0);white-space:nowrap;border:0}\n.mk-blok{border:1px solid #c9ccc8;background:#fbfbfa;padding:16px 18px;border-radius:3px}\n.mk-blok > * + *{margin-top:10px}\n.mk-blok h4{font-size:16px;font-weight:700}\n.mk-ok{border-left:4px solid #2c6a4c}\n.mk-uwaga{border-left:4px solid #b4322b}\n.mk-licz{font-size:13px;color:#4a4e55}\n.mk-mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:13px}\n.mk ul.mk-lista{list-style:none;display:flex;flex-direction:column;gap:8px}\n.mk ul.mk-lista > li{padding-left:18px;position:relative}\n.mk ul.mk-lista > li::before{content:'';position:absolute;left:0;top:.62em;\n width:7px;height:7px;background:#b4322b;border-radius:1px}\n@media (max-width:520px){.mk-cialo{padding:15px}.mk-glowa{padding:12px 15px}}\n.mk[hidden],.mk [hidden]{display:none!important}\n\n.mk-fs{border:1px solid #c9ccc8;border-radius:3px;padding:14px 16px;background:#fbfbfa;margin:0}\n.mk-pyt{font-weight:600;font-size:16px;margin-bottom:11px;line-height:1.4}\n.mk-skala{display:flex;flex-direction:column;gap:7px}\n.mk-opcja{display:flex;align-items:center;gap:10px;border:1px solid #7d838a;border-radius:3px;\n padding:9px 12px;cursor:pointer;background:#fff;min-height:44px}\n.mk-opcja:hover{background:#eef0ee}\n.mk-opcja:has(.mk-radio:checked){border-color:#16181c;border-width:2px;padding:8px 11px}\n.mk-opcja:focus-within{outline:3px solid #b4322b;outline-offset:2px}\n.mk-radio{width:18px;height:18px;accent-color:#b4322b;margin:0;flex:none}\n.mk-pas{height:12px;background:#dcdedb;border-radius:2px;overflow:hidden}\n.mk-pas-w{display:block;height:100%;background:#b4322b}\n.mk-wynik{font-weight:700;font-size:17px}\n";
var D = {"nad": "Ćwiczenie · bańka informacyjna", "tytul": "Twoja bańka", "pytania": [{"t": "Skąd najczęściej dowiadujesz się, co się dzieje w kraju?", "o": [{"t": "Z serwisu społecznościowego, przewijając", "p": 0}, {"t": "Z jednego portalu, który mam w zakładkach", "p": 1}, {"t": "Z kilku różnych źródeł, świadomie porównując", "p": 2}]}, {"t": "Kiedy ostatnio zdarzyło Ci się przeczytać do końca tekst autora, z którym się nie zgadzasz?", "o": [{"t": "Nie pamiętam takiej sytuacji", "p": 0}, {"t": "Kilka miesięcy temu", "p": 1}, {"t": "W ostatnim tygodniu", "p": 2}]}, {"t": "Co robisz, gdy nagłówek Cię zdenerwuje?", "o": [{"t": "Udostępniam albo komentuję od razu", "p": 0}, {"t": "Czytam tekst, potem ewentualnie reaguję", "p": 1}, {"t": "Szukam tej samej sprawy w innym źródle, zanim zareaguję", "p": 2}]}, {"t": "Czy wiesz, kto jest właścicielem serwisu, z którego najczęściej czerpiesz informacje?", "o": [{"t": "Nie mam pojęcia", "p": 0}, {"t": "Mniej więcej", "p": 1}, {"t": "Tak, mam to sprawdzone", "p": 2}]}, {"t": "Ile kont, które regularnie czytasz, prezentuje poglądy odmienne od Twoich?", "o": [{"t": "Żadne albo prawie żadne", "p": 0}, {"t": "Jedno, dwa", "p": 1}, {"t": "Kilka — celowo je obserwuję", "p": 2}]}, {"t": "Gdy algorytm podsuwa Ci treść, która „idealnie trafia” — co myślisz?", "o": [{"t": "Że mam dobry gust", "p": 0}, {"t": "Że to przypadek", "p": 1}, {"t": "Że ktoś zmierzył, co mnie zatrzymuje", "p": 2}]}], "progi": [[0, 4, "Bańka szczelna", "Informacje docierają do Ciebie głównie jedną drogą i rzadko je konfrontujesz. To nie jest wada charakteru — to domyślne ustawienie, w którym algorytmy chcą nas trzymać, bo zadowolenie zatrzymuje nas dłużej. Pierwszy krok jest tani: wybierz jedno źródło spoza swojego kręgu i czytaj je przez tydzień bez komentowania."], [5, 8, "Bańka z nieszczelnościami", "Zdarza Ci się sprawdzać i konfrontować, ale nieregularnie — zwykle wtedy, gdy sprawa jest ważna. Warto przenieść to z trybu wyjątkowego do nawyku: reguła „nie udostępniam przed przeczytaniem” kosztuje kilkanaście sekund i wyłapuje większość wpadek."], [9, 12, "Bańka pod kontrolą", "Świadomie różnicujesz źródła i sprawdzasz, kto mówi. Uwaga na jedną pułapkę: im lepiej ktoś zna mechanizmy manipulacji, tym pewniej sądzi, że jego samego nie dotyczą. To się nazywa ślepota na własne uprzedzenia i działa także na Ciebie."]], "przycisk": "Pokaż wynik", "brak": "Odpowiedz na wszystkie sześć pytań. Przenoszę kursor do pierwszego bez odpowiedzi.", "wynik_pre": "Twój wynik: {0} na 12 punktów."};
function ensure(){
  var w = document.getElementById('mk-banka') || document.querySelector('.mk-banka');
  if(!w) return null;
  w.id='mk-banka'; w.className='mk mk-banka';
  return w;
}
function stylKiedys(){
  if(document.querySelector('style[data-mk="mk-banka"]')) return;
  var st=document.createElement('style');
  st.setAttribute('data-mk','mk-banka');
  st.appendChild(document.createTextNode(CSS));
  (document.head||document.documentElement).appendChild(st);
}
function el(t,k,tx){var e=document.createElement(t); if(k) e.className=k;
  if(tx!==undefined && tx!==null) e.textContent=tx; return e;}
function glowa(root){
  var g=el('div','mk-glowa');
  if(D.nad){var n=el('p','mk-nad',D.nad); g.appendChild(n);}
  g.appendChild(el('h3',null,D.tytul));
  root.appendChild(g);
  var c=el('div','mk-cialo'); root.appendChild(c); return c;
}
function zlecenie(c){
  if(!D.zlecenie) return;
  var z=el('div','mk-zlec');
  z.appendChild(el('p','mk-od', D.zlecenie.od || 'Zlecenie z redakcji'));
  z.appendChild(el('p',null, D.zlecenie.tresc));
  c.appendChild(z);
}

function buduj(c, root){
  var N = D.pytania.length, odp = {};
  c.appendChild(el('p','mk-lid',
    'Wynik zostaje na Twoim ekranie. Nie zapisuje się nigdzie i nie wpływa na ocenę.'));
  var glos = el('p','mk-sr'); glos.setAttribute('role','status'); c.appendChild(glos);

  D.pytania.forEach(function(p, i){
    var fs=document.createElement('fieldset'); fs.className='mk-fs'; fs.id='mk-p'+i;
    var lg=document.createElement('legend'); lg.className='mk-sr';
    lg.textContent='Pytanie '+(i+1)+' z '+N+': '+p.t; fs.appendChild(lg);
    var h=el('p','mk-pyt'); h.setAttribute('aria-hidden','true'); h.textContent=(i+1)+'. '+p.t;
    fs.appendChild(h);
    var box=el('div','mk-skala');
    p.o.forEach(function(o, j){
      var id='mk-o'+i+'-'+j;
      var lab=document.createElement('label'); lab.className='mk-opcja'; lab.setAttribute('for',id);
      var inp=document.createElement('input');
      inp.type='radio'; inp.name='mk-q'+i; inp.id=id; inp.value=String(o.p); inp.className='mk-radio';
      lab.appendChild(inp); lab.appendChild(el('span',null,o.t));
      inp.addEventListener('change', function(){ odp[i]=o.p; odswiez(); });
      box.appendChild(lab);
    });
    fs.appendChild(box); c.appendChild(fs);
  });

  var licz=el('p','mk-licz'); c.appendChild(licz);
  var btny=el('div','mk-btny');
  var btn=el('button','mk-btn',D.przycisk); btn.type='button';
  btn.setAttribute('aria-disabled','true');
  btny.appendChild(btn); c.appendChild(btny);
  var strefa=el('div'); c.appendChild(strefa);

  function odswiez(){
    var n=Object.keys(odp).length;
    licz.textContent='Odpowiedzi: '+n+' z '+N;
    var komplet = (n===N);
    btn.setAttribute('aria-disabled', komplet ? 'false':'true');
    if(komplet) glos.textContent='Wszystkie pytania wypełnione. Możesz pokazać wynik.';
  }
  odswiez();

  btn.addEventListener('click', function(){
    if(btn.getAttribute('aria-disabled')==='true'){
      glos.textContent = D.brak;
      for(var i=0;i<N;i++){ if(odp[i]===undefined){
        var f=document.getElementById('mk-p'+i); f.querySelector('input').focus(); break; } }
      return;
    }
    var suma=0; for(var k in odp) suma += odp[k];
    var pr=null;
    D.progi.forEach(function(g){ if(suma>=g[0] && suma<=g[1]) pr=g; });
    strefa.innerHTML='';
    var b=el('div','mk-blok mk-ok'); b.id='mk-wyn'; b.setAttribute('tabindex','-1');
    var echo=el('p','mk-sr'); echo.setAttribute('data-echo','1');
    echo.textContent = D.wynik_pre.split('{0}').join(String(suma)) + ' ' + pr[2] + '. ' + pr[3];
    b.appendChild(echo);
    var pas=el('div','mk-pas'); pas.setAttribute('aria-hidden','true');
    var wyp=el('span','mk-pas-w'); wyp.style.width = Math.round(suma/12*100)+'%';
    pas.appendChild(wyp); b.appendChild(pas);
    var nag=el('p','mk-wynik'); nag.setAttribute('aria-hidden','true');
    nag.textContent = D.wynik_pre.split('{0}').join(String(suma)); b.appendChild(nag);
    b.appendChild(el('h4',null,pr[2]));
    b.appendChild(el('p',null,pr[3]));
    strefa.appendChild(b); b.focus();
  });
}

function start(){
  var root=ensure();
  if(!root || root.getAttribute('data-mk-init')) return;
  root.setAttribute('data-mk-init','1');
  root.setAttribute('lang','pl');
  stylKiedys();
  root.innerHTML='';
  var c=glowa(root);
  zlecenie(c);
  buduj(c, root);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
else start();
})();
// ]]>
</script>
</main>
</body>
</html>
