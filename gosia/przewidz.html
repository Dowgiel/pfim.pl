<!doctype html>
<html lang="pl">
<head>

<main class="cw">
<p class="cw-kurs">Myślenie krytyczne, czyli jak nie ulegać manipulacji</p>
<h1>Ćwiczenie: Przewidź, co się stanie</h1>
<div class="mk mk-przewidz" id="mk-przewidz">Ćwiczenie „Przewidź, co się stanie” — pięć sytuacji o mitach, fake newsach i sprostowaniach. Jeśli się nie wczyta, włącz JavaScript.</div>
<script>
// <![CDATA[
(function(){
'use strict';
var CSS = "\n.mk{all:initial;display:block;font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,\n 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#16181c;\n background:#f4f4f2;border:1px solid #c9ccc8;border-radius:3px;padding:0;margin:1.4em 0;\n box-sizing:border-box;overflow-x:clip}\n.mk *,.mk *::before,.mk *::after{box-sizing:border-box}\n.mk p,.mk h3,.mk h4,.mk ul,.mk ol,.mk li,.mk figure{margin:0;padding:0}\n.mk-glowa{background:#16181c;color:#f4f4f2;padding:14px 20px;display:flex;\n flex-wrap:wrap;gap:4px 14px;align-items:baseline}\n.mk-glowa .mk-nad{font-size:11px;letter-spacing:.14em;text-transform:uppercase;\n color:#e8a49f;font-weight:700}\n.mk-glowa h3{font-size:20px;font-weight:700;line-height:1.25;color:#f4f4f2;width:100%}\n.mk-cialo{padding:20px}\n.mk-cialo > * + *{margin-top:14px}\n.mk-lid{color:#4a4e55;max-width:62ch}\n.mk-zlec{border-left:3px solid #b4322b;background:#ecece9;padding:12px 16px}\n.mk-zlec .mk-od{font-size:11px;letter-spacing:.1em;text-transform:uppercase;\n color:#8c3029;font-weight:700;margin-bottom:5px}\n.mk-btn{display:inline-block;font:inherit;font-weight:600;color:#f4f4f2;background:#16181c;\n border:2px solid #16181c;border-radius:3px;padding:10px 18px;cursor:pointer;min-height:44px;\n text-align:center}\n.mk-btn:hover{background:#31353d;border-color:#31353d}\n.mk-btn:focus-visible{outline:3px solid #b4322b;outline-offset:2px}\n.mk-btn[aria-disabled=\"true\"]{background:#565b63;border-color:#565b63;cursor:not-allowed}\n.mk-btn2[aria-disabled=\"true\"]{background:#e3e3e0;color:#4a4e55;border-color:#7d838a}\n.mk-btn2{background:#f4f4f2;color:#16181c}\n.mk-btn2:hover{background:#e3e3e0}\n.mk-btny{display:flex;flex-wrap:wrap;gap:10px}\n.mk-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;\n clip:rect(0 0 0 0);white-space:nowrap;border:0}\n.mk-blok{border:1px solid #c9ccc8;background:#fbfbfa;padding:16px 18px;border-radius:3px}\n.mk-blok > * + *{margin-top:10px}\n.mk-blok h4{font-size:16px;font-weight:700}\n.mk-ok{border-left:4px solid #2c6a4c}\n.mk-uwaga{border-left:4px solid #b4322b}\n.mk-licz{font-size:13px;color:#4a4e55}\n.mk-mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:13px}\n.mk ul.mk-lista{list-style:none;display:flex;flex-direction:column;gap:8px}\n.mk ul.mk-lista > li{padding-left:18px;position:relative}\n.mk ul.mk-lista > li::before{content:'';position:absolute;left:0;top:.62em;\n width:7px;height:7px;background:#b4322b;border-radius:1px}\n@media (max-width:520px){.mk-cialo{padding:15px}.mk-glowa{padding:12px 15px}}\n.mk[hidden],.mk [hidden]{display:none!important}\n\n.mk-fs{border:1px solid #c9ccc8;border-left:4px solid #16181c;border-radius:3px;padding:14px 16px;background:#fbfbfa;margin:0;min-width:0}\n.mk-fs > * + *{margin-top:12px}\n.mk-pyt{font-size:17px;font-weight:600;line-height:1.45}\n.mk-opcje{display:flex;flex-direction:column;gap:8px}\n.mk-opcja{display:flex;align-items:flex-start;gap:10px;border:1px solid #7d838a;border-radius:3px;\n padding:10px 13px;cursor:pointer;background:#fff;min-height:44px}\n.mk-opcja:hover{background:#eef0ee}\n.mk-opcja:has(.mk-radio:checked){border-color:#16181c;border-width:2px;padding:9px 12px}\n.mk-opcja:focus-within{outline:3px solid #b4322b;outline-offset:2px}\n.mk-radio{width:18px;height:18px;accent-color:#b4322b;margin:3px 0 0;flex:none}\n.mk-op-ok,.mk-op-ok:hover{border-color:#2c6a4c;background:#e2efe7}\n.mk-op-nie,.mk-op-nie:hover{border-color:#b4322b;background:#f6e3e1}\n.mk-op-ok::after{content:'✓';margin-left:auto;padding-left:8px;font-weight:700;color:#245a40}\n.mk-op-nie::after{content:'✗';margin-left:auto;padding-left:8px;font-weight:700;color:#96261f}\n.mk-fb{padding:11px 14px;border-radius:3px;background:#fff;border:1px solid #c9ccc8}\n.mk-fb:focus{outline:none}\n.mk-fb > * + *{margin-top:6px}\n.mk-fb-ok{border-left:4px solid #2c6a4c}\n.mk-fb-nie{border-left:4px solid #b4322b}\n.mk-fb-info{border-left:4px solid #16181c}\n.mk-werd{font-weight:700}\n.mk-fb-ok .mk-werd{color:#245a40}\n.mk-fb-nie .mk-werd{color:#96261f}\n";
var D = {"nad": "Ćwiczenie · mity i fake newsy", "tytul": "Przewidź, co się stanie", "lid": "Pięć sytuacji. Zanim zobaczysz, co mówią badania, wybierz, co Twoim zdaniem się wydarzy. Nie ma tu punktów — liczy się moment, w którym intuicja rozmija się z faktami.", "postep": "Sprawdzone przewidywania: {0} z {1}", "pytania": [{"pytanie": "Opowieść o „cudzie gospodarczym” miasta składa się wyłącznie z prawdziwych informacji: nowa hala, nowy park, rekordowy festiwal. O kosztach i problemach nie ma w niej ani słowa. Czy taki przekaz może działać jak mit?", "opcje": ["Nie — mit z definicji jest kłamstwem.", "Tak — o micie decyduje uproszczenie i nadawanie sensu, a nie to, czy elementy są prawdziwe.", "Tylko wtedy, gdy opowiada o dalekiej przeszłości."], "dobra": 1, "wyjasnienie": "W badaniach kultury mit to sposób mówienia: upraszcza świat i przedstawia jedną wersję jako oczywistą (Barthes, Napiórkowski). Może być zbudowany z prawdziwych elementów — działa, bo układa je w prostą opowieść, w której nie ma miejsca na koszty i wątpliwości."}, {"pytanie": "Lokalny portal pisze, że pożar hali wywołały składowane tam nielegalnie chemikalia. Następnego dnia straż pożarna prostuje: przyczyną było zwarcie instalacji. Co najprawdopodobniej dzieje się z przekonaniami osób, które przeczytały obie informacje?", "opcje": ["Fałszywa wersja znika — przecież dostały oficjalne wyjaśnienie.", "Fałszywa wersja słabnie, ale część osób nadal wyciąga z niej wnioski.", "Fałszywa wersja się umacnia, bo sprostowania zawsze działają odwrotnie."], "dobra": 1, "wyjasnienie": "Tak działa efekt ciągłego wpływu. Przegląd badań Lewandowsky'ego i współpracowników (2012) pokazuje, że sprostowanie przesuwa przekonania w stronę faktów, ale rzadko usuwa wpływ fałszywej informacji w całości."}, {"pytanie": "Czy sprostowanie może sprawić, że ludzie jeszcze mocniej uwierzą w fałsz?", "opcje": ["Tak, to typowa reakcja — dlatego lepiej nie prostować.", "Opisywano takie przypadki, ale w nowszych badaniach okazały się rzadkie.", "Nie, takiego zjawiska nigdy nie zaobserwowano."], "dobra": 1, "wyjasnienie": "Nyhan i Reifler (2010) opisali przypadki, w których korekta wzmacniała błędne przekonania u części osób badanych. Wood i Porter (2019) w serii eksperymentów nie znaleźli sprostowań wywołujących taki efekt. Spór nie jest zamknięty, ale obawa przed „efektem odwrotnym” nie jest dobrym powodem, żeby nie prostować."}, {"pytanie": "W 2016 roku w mieście Veles w Macedonii (dziś Macedonii Północnej) działało ponad sto witryn z fałszywymi wiadomościami o amerykańskiej polityce. Kto je prowadził i po co?", "opcje": ["Służby obcego państwa, żeby wpłynąć na wybory.", "Głównie młodzi ludzie — nastoletni i dwudziestoletni — dla przychodów z reklam.", "Amerykańskie sztaby wyborcze, żeby zaszkodzić rywalom."], "dobra": 1, "wyjasnienie": "Motywacja była czysto ekonomiczna: im więcej kliknięć, tym większy przychód z reklam. Przypadek opisali m.in. Hughes i Waismel-Manor (2021). Fake news nie musi wynikać z przekonań — wystarczy, że się opłaca."}, {"pytanie": "Dlaczego teorie spiskowe przyciągają ludzi?", "opcje": ["Bo obiecują zaspokoić potrzebę zrozumienia, bezpieczeństwa i dobrego obrazu siebie oraz swojej grupy.", "Bo dostarczają dowodów, których brakuje w mediach głównego nurtu.", "Bo naprawdę dają ludziom trwałe poczucie bezpieczeństwa i kontroli."], "dobra": 0, "wyjasnienie": "Autorzy przeglądu badań z 2017 roku — Douglas, Sutton i Cichocka — opisują trzy grupy motywów: poznawcze, egzystencjalne i społeczne. Zastrzegają jednak, że brak dowodów, by wiara w spisek te potrzeby naprawdę zaspokajała. Teorie spiskowe bardziej kuszą, niż dają — dlatego odpowiedź o trwałym poczuciu bezpieczeństwa nie zgadza się z badaniami."}]};
function ensure(){
  var w = document.getElementById('mk-przewidz') || document.querySelector('.mk-przewidz');
  if(!w) return null;
  w.id='mk-przewidz'; w.className='mk mk-przewidz';
  return w;
}
function stylKiedys(){
  if(document.querySelector('style[data-mk="mk-przewidz"]')) return;
  var st=document.createElement('style');
  st.setAttribute('data-mk','mk-przewidz');
  st.appendChild(document.createTextNode(CSS));
  (document.head||document.documentElement).appendChild(st);
}
function el(t,k,tx){var e=document.createElement(t); if(k) e.className=k;
  if(tx!==undefined && tx!==null) e.textContent=tx; return e;}
function glowa(root){
  var g=el('div','mk-glowa');
  if(D.nad){var n=el('p','mk-nad',D.nad); g.appendChild(n);}
  g.appendChild(el('h3',null,D.tytul));
  root.appendChild(g);
  var c=el('div','mk-cialo'); root.appendChild(c); return c;
}
function zlecenie(c){
  if(!D.zlecenie) return;
  var z=el('div','mk-zlec');
  z.appendChild(el('p','mk-od', D.zlecenie.od || 'Zlecenie z redakcji'));
  z.appendChild(el('p',null, D.zlecenie.tresc));
  c.appendChild(z);
}

function buduj(c, root){
  var N = D.pytania.length, zrobione = 0;
  c.appendChild(el('p','mk-lid', D.lid));
  var licz = el('p','mk-licz');
  c.appendChild(licz);
  function licznik(){
    licz.textContent = D.postep.split('{0}').join(String(zrobione)).split('{1}').join(String(N));
  }
  licznik();

  D.pytania.forEach(function(q, i){
    var fs = document.createElement('fieldset');
    fs.className = 'mk-fs';
    var lg = document.createElement('legend');
    lg.className = 'mk-sr';
    lg.textContent = 'Sytuacja ' + (i + 1) + ' z ' + N + ': ' + q.pytanie;
    fs.appendChild(lg);
    var widoczne = el('p','mk-pyt', q.pytanie);
    widoczne.setAttribute('aria-hidden','true');
    fs.appendChild(widoczne);

    var opcje = el('div','mk-opcje');
    var wiersze = [];
    var btn = el('button','mk-btn','Sprawdź przewidywanie');
    btn.type = 'button';
    btn.setAttribute('aria-disabled','true');
    q.opcje.forEach(function(o, j){
      var id = 'mk-q' + i + '-' + j;
      var lab = document.createElement('label');
      lab.className = 'mk-opcja';
      lab.setAttribute('for', id);
      var inp = document.createElement('input');
      inp.type = 'radio'; inp.name = 'mk-q' + i; inp.id = id; inp.value = String(j);
      inp.className = 'mk-radio';
      inp.addEventListener('change', function(){ btn.setAttribute('aria-disabled','false'); });
      lab.appendChild(inp);
      lab.appendChild(el('span', null, o));
      opcje.appendChild(lab);
      wiersze.push({inp: inp, lab: lab});
    });
    fs.appendChild(opcje);
    fs.appendChild(btn);

    var fb = el('div','mk-fb');
    fb.hidden = true;
    fb.setAttribute('tabindex','-1');
    fs.appendChild(fb);

    btn.addEventListener('click', function(){
      var wyb = -1;
      wiersze.forEach(function(x, j){ if(x.inp.checked){ wyb = j; } });
      fb.innerHTML = '';
      fb.hidden = false;
      if(wyb < 0){
        fb.className = 'mk-fb mk-fb-info';
        fb.appendChild(el('p','mk-werd','Najpierw wybierz jedną odpowiedź. Przenoszę tam kursor.'));
        wiersze[0].inp.focus();
        return;
      }
      wiersze.forEach(function(x, j){
        x.lab.classList.remove('mk-op-ok', 'mk-op-nie');
        if(j === q.dobra){ x.lab.classList.add('mk-op-ok'); }
        else if(j === wyb){ x.lab.classList.add('mk-op-nie'); }
      });
      var traf = (wyb === q.dobra);
      fb.className = 'mk-fb ' + (traf ? 'mk-fb-ok' : 'mk-fb-nie');
      fb.appendChild(el('p','mk-werd', traf ? 'Trafne przewidywanie.' : 'Badania mówią co innego.'));
      if(!traf){
        fb.appendChild(el('p', null, 'Zgodna z badaniami jest odpowiedź: „' + q.opcje[q.dobra] + '”'));
      }
      fb.appendChild(el('p', null, q.wyjasnienie));
      fb.focus();
      if(!fs.getAttribute('data-zrob')){
        fs.setAttribute('data-zrob','1');
        zrobione++;
        licznik();
      }
    });
    c.appendChild(fs);
  });
}

function start(){
  var root=ensure();
  if(!root || root.getAttribute('data-mk-init')) return;
  root.setAttribute('data-mk-init','1');
  root.setAttribute('lang','pl');
  stylKiedys();
  root.innerHTML='';
  var c=glowa(root);
  zlecenie(c);
  buduj(c, root);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
else start();
})();
// ]]>
</script>
</main>
</body>
</html>
