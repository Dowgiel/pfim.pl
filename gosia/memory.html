    ui.plansza.setAttribute('role','group');
    ui.plansza.setAttribute('aria-label', T.planszaEtyk);
    gra.karty.forEach(function(k, i){
      var b = el('button','mk-m-karta');
      b.type = 'button';
      b.appendChild(el('span','mk-m-nr', String(i + 1)));
      b.appendChild(el('span','mk-m-tresc', k.tekst));
      b.appendChild(ikonaPtak());
      b.firstChild.setAttribute('aria-hidden','true');
      b.childNodes[1].setAttribute('aria-hidden','true');
      b.addEventListener('click', function(){ klik(i); });
      b.addEventListener('animationend', function(){ b.classList.remove('mk-m-obrot'); });
      ui.karty.push(b);
      ui.plansza.appendChild(b);
      odswiezKarte(i, false);
    });
    ekran.appendChild(ui.plansza);

    ui.pauzaInfo = el('div','mk-m-pauzainfo');
    ui.pauzaInfo.hidden = true;
    ui.pauzaTxt = el('p', null);
    ui.pauzaInfo.appendChild(ui.pauzaTxt);
    ekran.appendChild(ui.pauzaInfo);

    ekran.appendChild(el('p','mk-m-podp', T.podpowiedz));
    pokazDymek('', '', T.dymekStart);
    wyrownajDymek();
    if(gra.faza === 'podglad'){
      ui.dymek.hidden = true;
      if(tryb !== 'szybki'){ ui.pauza.setAttribute('aria-disabled', 'true'); }
    }
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(function(){ if(stan === 'gra' && ui){ wyrownajDymek(); } });
    }
  }

  // dymek ma zawsze tyle samo miejsca, żeby plansza nie skakała po znalezieniu pary
  function pokazDymek(klasa, naglowek, tekst){
    ui.dymek.className = 'mk-m-dymek' + (klasa ? ' mk-m-dymek-' + klasa : '');
    ui.dymek.innerHTML = '';
    var akapit = el('p','mk-m-dymek-t');
    if(naglowek){
      akapit.appendChild(el('strong', null, naglowek));
      akapit.appendChild(document.createTextNode(' ' + tekst));
    } else { akapit.textContent = tekst; }
    ui.dymek.appendChild(akapit);
    if(gra){ gra.dymek = {klasa: klasa, n: naglowek, t: tekst}; }
  }
  function wyrownajDymek(){
    if(!ui || !ui.dymek){ return; }
    var teraz = gra && gra.dymek ? gra.dymek : {klasa: '', n: '', t: T.dymekStart};
    var bylUkryty = ui.dymek.hidden;
    ui.dymek.hidden = false;           // schowany dymek ma wysokość 0, więc na czas pomiaru go pokazujemy
    var kand = [['', '', T.dymekStart], ['', '', T.dymekJedna], ['zle', '', T.dymekZle], ['zle', '', T.dymekZleSzybki],
                ['', '', T.dymekZakryte]];
    P.forEach(function(p){ kand.push(['ok', wstaw(T.dymekPara, {nazwa: p.nazwa}), p.wyjasnienie]); });
    ui.dymek.style.minHeight = '';
    var maks = 0;
    kand.forEach(function(k){
      pokazDymek(k[0], k[1], k[2]);
      var h = ui.dymek.offsetHeight;
      if(h > maks){ maks = h; }
    });
    pokazDymek(teraz.klasa, teraz.n, teraz.t);
    if(maks > 40){ ui.dymek.style.minHeight = maks + 'px'; }
    ui.dymek.hidden = bylUkryty;
    ostSzer = ekran.clientWidth;
  }
  window.addEventListener('resize', function(){
    clearTimeout(tmResize);
    tmResize = setTimeout(function(){
      if(stan === 'gra' && ui && ekran.clientWidth !== ostSzer){ wyrownajDymek(); }
    }, 150);
  });

  // ---------------------------------------------------------- karty
  function odswiezKarte(i, animuj){
    var k = gra.karty[i];
    var b = ui.karty[i];
    var byl = b.classList.contains('mk-m-obrot');
    b.className = 'mk-m-karta mk-m-k-' + k.rodzaj + ' mk-m-' + k.stan + (byl ? ' mk-m-obrot' : '');
    var etyk;
    if(k.stan === 'zakryta'){ etyk = wstaw(T.kartaZakryta, {n: i + 1}); }
    else if(k.stan === 'odkryta' || k.stan === 'podglad'){ etyk = wstaw(T.kartaOdkryta, {n: i + 1, t: k.tekst}); }
    else { etyk = wstaw(T.kartaPara, {n: i + 1, t: bezKropki(k.tekst)}); }
    b.setAttribute('aria-label', etyk);
    var nieaktywna = k.stan === 'para' || k.stan === 'podglad' || (k.stan === 'zakryta' && (gra.faza !== 'wybor' || gra.pauza));
    b.setAttribute('aria-disabled', nieaktywna ? 'true' : 'false');
    if(animuj){
      b.classList.remove('mk-m-obrot');
      void b.offsetWidth;
      b.classList.add('mk-m-obrot');
    }
  }
  function odswiezWszystkie(){
    for(var i = 0; i < gra.karty.length; i++){ odswiezKarte(i, false); }
  }
  function aktualizujHud(){
    ui.ruchy.textContent = String(gra.ruchy);
    ui.pary.textContent = wstaw(T.paryWart, {n: gra.znalezione.length, ile: ILE});
    pokazCzas();
  }
  function ustawZakryj(aktywny){
    ui.zakryj.setAttribute('aria-disabled', aktywny ? 'false' : 'true');
  }

  function klik(i){
    if(!gra || stan !== 'gra' || gra.pauza || gra.faza === 'koniec' || gra.faza === 'podglad'){ return; }
    var k = gra.karty[i];
    if(k.stan === 'para'){ oglos(wstaw(T.ogJuzPara, {n: i + 1})); return; }
    if(k.stan === 'odkryta'){ oglos(wstaw(T.ogJuzOdkryta, {n: i + 1})); return; }
    if(gra.faza === 'zle'){
      if(tryb === 'bez'){ oglos(T.ogNajpierw); ui.zakryj.focus(); }
      else { oglos(T.ogCzekaj); }
      return;
    }
    odkryj(i);
  }

  function odkryj(i){
    var k = gra.karty[i];
    if(!gra.czasStart){ gra.czasStart = true; stoperStart(); }
    k.stan = 'odkryta';
    gra.odkryte.push(i);
    odswiezKarte(i, true);
    if(gra.odkryte.length === 1){
      pokazDymek('', '', T.dymekJedna);
      oglos(wstaw(T.ogOdkryta, {n: i + 1, t: kropka(k.tekst)}));
      return;
    }
    gra.ruchy++;
    var a = gra.karty[gra.odkryte[0]];
    if(a.par === k.par){ znalezionoPare(a, k, i); }
    else { niePara(a, k, i); }
  }

  function znalezionoPare(a, b, i){
    var p = P[a.par];
    a.stan = 'para';
    b.stan = 'para';
    gra.odkryte = [];
    gra.znalezione.push(a.par);
    gra.faza = gra.znalezione.length >= ILE ? 'koniec' : 'wybor';
    odswiezWszystkie();
    aktualizujHud();
    var nagl = wstaw(T.dymekPara, {nazwa: p.nazwa});
    pokazDymek('ok', nagl, p.wyjasnienie);
    var ogl = wstaw(T.ogPara, {n: i + 1, t: kropka(b.tekst), nazwa: p.nazwa, w: p.wyjasnienie, p: gra.znalezione.length, ile: ILE});
    if(gra.faza === 'koniec'){
      stoperStop();
      zZakStop();
      ui.zakryj.hidden = true;
      ui.pauza.hidden = true;
      ui.wynikBtn.hidden = false;
      ui.wynikBtn.focus();
      oglos(ogl + ' ' + T.ogKoniecRundy);
    } else {
      oglos(ogl);
    }
  }

  function niePara(a, b, i){
    gra.faza = 'zle';
    odswiezWszystkie();
    aktualizujHud();
    ustawZakryj(true);
    if(tryb === 'szybki'){
      pokazDymek('zle', '', T.dymekZleSzybki);
      oglos(wstaw(T.ogZleSzybki, {n: i + 1, t: kropka(b.tekst)}));
      var ms = D.szybki.baza + D.szybki.znak * Math.max(a.tekst.length, b.tekst.length);
      zZakStart(ms, ms);
    } else {
      pokazDymek('zle', '', T.dymekZle);
      oglos(wstaw(T.ogZle, {n: i + 1, t: kropka(b.tekst)}));
      ui.zakryj.focus();
    }
  }

  function zakryj(auto){
    if(!gra || stan !== 'gra' || gra.faza !== 'zle' || gra.pauza){ return; }
    zZakStop();
    var ost = gra.odkryte[gra.odkryte.length - 1];
    gra.odkryte.forEach(function(i){ gra.karty[i].stan = 'zakryta'; });
    var rusz = gra.odkryte.slice();
    gra.odkryte = [];
    gra.faza = 'wybor';
    odswiezWszystkie();
    rusz.forEach(function(i){ odswiezKarte(i, true); });
    ustawZakryj(false);
    pokazDymek('', '', T.dymekZakryte);
    oglos(T.ogZakryte);
    if(!auto){ ui.karty[ost].focus(); }
  }

  // ---------------------------------------------------------- koniec podglądu: karty się zakrywają, zaczyna się gra
  function zakryjPodglad(wskaznik){
    if(!gra || stan !== 'gra' || gra.faza !== 'podglad' || gra.pauza){ return; }
    gra.faza = 'wybor';
    gra.karty.forEach(function(k){ k.stan = 'zakryta'; });
    ui.pbox.hidden = true;
    ui.dymek.hidden = false;
    ui.pauza.setAttribute('aria-disabled', 'false');
    pokazDymek('', '', T.dymekStart);
    for(var i = 0; i < gra.karty.length; i++){ odswiezKarte(i, true); }
    if(wskaznik){ ui.karty[0].focus({preventScroll: true}); } else { ui.karty[0].focus(); }
    oglos(T.ogStart, 350);
  }

  // ---------------------------------------------------------- pauza (WCAG 2.2.1 / 2.2.2)
  function pauza(powod){
    if(!gra || stan !== 'gra' || gra.pauza || gra.faza === 'koniec'){ return; }
    if(gra.faza === 'podglad' && tryb !== 'szybki'){ return; }   // w podglądzie „Bez pośpiechu” nic nie biegnie
    gra.pauza = true;
    stoperStop();
    if(zZak){
      wstrz = {pozostalo: Math.max(0, zZak.koniec - Date.now()), calosc: zZak.calosc};
      clearTimeout(zZak.tm);
      zZak = null;
    } else { wstrz = null; }
    ui.pauzaInfo.style.minHeight = ui.plansza.offsetHeight + 'px';
    ui.plansza.hidden = true;
    if(gra.faza === 'podglad'){ ui.pbox.hidden = true; }
    ui.pauzaInfo.hidden = false;
    ui.pauzaTxt.textContent = powod === 'karta' ? T.pauzaInfoK : T.pauzaInfoR;
    ui.pauza.textContent = T.wznow;
    ustawZakryj(false);
    odswiezWszystkie();
    oglos(T.pauzaOgl);
  }
  function wznow(){
    if(!gra || !gra.pauza){ return; }
    gra.pauza = false;
    ui.plansza.hidden = false;
    if(gra.faza === 'podglad'){ ui.pbox.hidden = false; }
    ui.pauzaInfo.hidden = true;
    ui.pauza.textContent = T.pauza;
    ustawZakryj(gra.faza === 'zle');
    odswiezWszystkie();
    oglos(T.wznowOgl);
    if(gra.czasStart && gra.faza !== 'koniec'){ stoperStart(); }
    if(wstrz){
      var w = wstrz;
      wstrz = null;
      zZakStart(w.pozostalo, w.calosc);
    }
  }
  document.addEventListener('visibilitychange', function(){
    if(document.hidden || document.visibilityState === 'hidden'){ pauza('karta'); }
  });

  // ---------------------------------------------------------- klawiatura: tylko wewnątrz gry (WCAG 2.1.4)
  function kolumny(){
    var gora = ui.karty[0].offsetTop;
    var n = 0;
    for(var i = 0; i < ui.karty.length; i++){
      if(ui.karty[i].offsetTop === gora){ n++; } else { break; }
    }
    return Math.max(1, n);
  }
  c.addEventListener('keydown', function(e){
    if(stan !== 'gra' || !gra || !ui){ return; }
    if(e.altKey || e.ctrlKey || e.metaKey){ return; }
    var k = e.key;
    if(k === 'z' || k === 'Z'){
      e.preventDefault();
      if(!e.repeat){ if(gra.faza === 'podglad'){ zakryjPodglad(false); } else { zakryj(false); } }
      return;
    }
    if(e.shiftKey){ return; }
    if((k === 'Enter' || k === ' ' || k === 'Spacebar') && e.repeat){ e.preventDefault(); return; }
    var idx = ui.karty.indexOf(e.target);
    if(idx < 0){ return; }
    var n = ui.karty.length;
    var kol = kolumny();
    var cel = -1;
    if(k === 'ArrowRight' || k === 'Right'){ cel = Math.min(n - 1, idx + 1); }
    else if(k === 'ArrowLeft' || k === 'Left'){ cel = Math.max(0, idx - 1); }
    else if(k === 'ArrowDown' || k === 'Down'){ cel = Math.min(n - 1, idx + kol); }
    else if(k === 'ArrowUp' || k === 'Up'){ cel = Math.max(0, idx - kol); }
    else if(k === 'Home'){ cel = 0; }
    else if(k === 'End'){ cel = n - 1; }
    if(cel >= 0){
      e.preventDefault();
      if(cel !== idx){ ui.karty[cel].focus(); }
    }
  });

  // ---------------------------------------------------------- start / koniec
  function zacznij(wskaznik){
    zZakStop();
    stoperStop();
    var ids = tasuj(P.map(function(p, i){ return i; })).slice(0, ILE);
    var karty = [];
    ids.forEach(function(pi){
      karty.push({par: pi, rodzaj: 'nazwa', tekst: P[pi].nazwa, stan: 'podglad'});
      karty.push({par: pi, rodzaj: 'przyklad', tekst: P[pi].przyklad, stan: 'podglad'});
    });
    gra = {karty: tasuj(karty), odkryte: [], ruchy: 0, znalezione: [], faza: 'podglad', pauza: false,
           czasMs: 0, czasOd: 0, czasStart: false, dymek: null};
    wstrz = null;
    stan = 'gra';
    budujEkranGry();
    if(tryb === 'szybki'){ gra.czasStart = true; stoperStart(); }   // „Szybki”: podgląd liczy się do czasu
    if(wskaznik){ ui.karty[0].focus({preventScroll: true}); } else { ui.karty[0].focus(); }
    oglos(T.podglad, 350);
  }

  function koniecGry(){
    zZakStop();
    stoperStop();
    wstrz = null;
    stan = 'koniec';
    var czas = Math.max(1, gra.czasMs);
    var ruchy = gra.ruchy;
    var gw = ruchy <= D.gwiazdki.trzy ? 3 : (ruchy <= D.gwiazdki.dwie ? 2 : 1);
    var tr = tryb;
    var poprzedni = rekordPamiec[tr];
    var zap = odczytajRekord(tr);
    if(zap > 0 && (poprzedni === 0 || zap < poprzedni)){ poprzedni = zap; }
    var nowy = poprzedni === 0 || czas < poprzedni;
    var zapisano = true;
    if(nowy){
      rekordPamiec[tr] = czas;
      zapisano = zapiszRekord(tr, czas);
    }
    var rekord = nowy ? czas : poprzedni;
    var znalezione = gra.znalezione.slice();

    ekran.innerHTML = '';
    ui = null;
    var wyn = el('div','mk-m-koniec');
    var h = el('h4','mk-m-wynik-h', wstaw(T.koniecH, {czas: czasSlowami(czas), ruchy: ruchy, g: gw}));
    h.setAttribute('tabindex','-1');
    wyn.appendChild(h);
    wyn.appendChild(el('p', null, wstaw(T.trybInfo, {t: T.trybNazwy[tr]})));

    var liczby = el('div','mk-m-hud mk-m-hud4');
    var k1 = kafel(T.lCzas, fmtCzas(czas));
    var k2 = kafel(T.lRuchy, String(ruchy));
    var k3 = el('div','mk-m-st');
    k3.appendChild(el('span','mk-m-stn', T.lGwiazdki));
    var w3 = el('span','mk-m-stw mk-m-gw');
    for(var g = 0; g < 3; g++){ w3.appendChild(ikonaGwiazda(g < gw)); }
    w3.appendChild(el('span','mk-m-gwtxt', wstaw(T.gwiazdkiWart, {g: gw})));
    k3.appendChild(w3);
    var k4 = kafel(T.lRekord, fmtCzas(rekord));
    liczby.appendChild(k1.k); liczby.appendChild(k2.k); liczby.appendChild(k3); liczby.appendChild(k4.k);
    wyn.appendChild(liczby);
    if(nowy){ wyn.appendChild(el('p','mk-m-rekord', T.nowyRekord)); }
    if(!zapisano){ wyn.appendChild(el('p','mk-licz', T.rekordBrakZapisu)); }

    wyn.appendChild(el('h4','mk-m-sekcja', T.parH));
    wyn.appendChild(el('p','mk-licz', T.parLid));
    var ul = el('ul','mk-lista mk-m-pary');
    znalezione.forEach(function(pi){
      var p = P[pi];
      var li = document.createElement('li');
      var p1 = el('p', null);
      p1.appendChild(el('strong', null, p.nazwa));
      p1.appendChild(document.createTextNode(' — ' + p.przyklad));
      li.appendChild(p1);
      li.appendChild(el('p','mk-m-wyj', p.wyjasnienie + ' ' + p.dodatek));
      ul.appendChild(li);
    });
    wyn.appendChild(ul);

    wyn.appendChild(el('h4','mk-m-sekcja', T.wnH));
    T.wn.forEach(function(par){ wyn.appendChild(el('p', null, par)); });

    var btny = el('div','mk-btny');
    var jeszcze = el('button','mk-btn', T.jeszcze);
    jeszcze.type = 'button';
    jeszcze.addEventListener('click', function(ev){ zacznij(!!ev && ev.detail > 0); });
    var zmien = el('button','mk-btn mk-btn2', T.zmien);
    zmien.type = 'button';
    zmien.addEventListener('click', function(){
      ekranStart();
      var r = ekran.querySelector('input[type="radio"]:checked');
      if(r){ r.focus(); }
    });
    btny.appendChild(jeszcze);
    btny.appendChild(zmien);
    wyn.appendChild(btny);
    ekran.appendChild(wyn);
    oglos('');
    h.focus();
  }

  ekranStart();
}

function start(){
  var root=ensure();
  if(!root || root.getAttribute('data-mk-init')) return;
  root.setAttribute('data-mk-init','1');
  root.setAttribute('lang','pl');
  stylKiedys();
  root.innerHTML='';
  var c=glowa(root);
  zlecenie(c);
  buduj(c, root);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
else start();
})();
