function pokaz(raw){
  return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:bin(D.iv)},k,bin(D.ct));
