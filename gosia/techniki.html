<h1>Ćwiczenie: Rozpoznaj technikę</h1>
<div class="mk mk-techniki" id="mk-techniki">Ćwiczenie „Rozpoznaj technikę” — dziesięć przekazów do dopasowania do technik propagandy. Jeśli się nie wczyta, włącz JavaScript.</div>
<script>
// <![CDATA[
(function(){
'use strict';
var CSS = "\n.mk{all:initial;display:block;font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,\n 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#16181c;\n background:#f4f4f2;border:1px solid #c9ccc8;border-radius:3px;padding:0;margin:1.4em 0;\n box-sizing:border-box;overflow-x:clip}\n.mk *,.mk *::before,.mk *::after{box-sizing:border-box}\n.mk p,.mk h3,.mk h4,.mk ul,.mk ol,.mk li,.mk figure{margin:0;padding:0}\n.mk-glowa{background:#16181c;color:#f4f4f2;padding:14px 20px;display:flex;\n flex-wrap:wrap;gap:4px 14px;align-items:baseline}\n.mk-glowa .mk-nad{font-size:11px;letter-spacing:.14em;text-transform:uppercase;\n color:#e8a49f;font-weight:700}\n.mk-glowa h3{font-size:20px;font-weight:700;line-height:1.25;color:#f4f4f2;width:100%}\n.mk-cialo{padding:20px}\n.mk-cialo > * + *{margin-top:14px}\n.mk-lid{color:#4a4e55;max-width:62ch}\n.mk-zlec{border-left:3px solid #b4322b;background:#ecece9;padding:12px 16px}\n.mk-zlec .mk-od{font-size:11px;letter-spacing:.1em;text-transform:uppercase;\n color:#8c3029;font-weight:700;margin-bottom:5px}\n.mk-btn{display:inline-block;font:inherit;font-weight:600;color:#f4f4f2;background:#16181c;\n border:2px solid #16181c;border-radius:3px;padding:10px 18px;cursor:pointer;min-height:44px;\n text-align:center}\n.mk-btn:hover{background:#31353d;border-color:#31353d}\n.mk-btn:focus-visible{outline:3px solid #b4322b;outline-offset:2px}\n.mk-btn[aria-disabled=\"true\"]{background:#565b63;border-color:#565b63;cursor:not-allowed}\n.mk-btn2[aria-disabled=\"true\"]{background:#e3e3e0;color:#4a4e55;border-color:#7d838a}\n.mk-btn2{background:#f4f4f2;color:#16181c}\n.mk-btn2:hover{background:#e3e3e0}\n.mk-btny{display:flex;flex-wrap:wrap;gap:10px}\n.mk-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;\n clip:rect(0 0 0 0);white-space:nowrap;border:0}\n.mk-blok{border:1px solid #c9ccc8;background:#fbfbfa;padding:16px 18px;border-radius:3px}\n.mk-blok > * + *{margin-top:10px}\n.mk-blok h4{font-size:16px;font-weight:700}\n.mk-ok{border-left:4px solid #2c6a4c}\n.mk-uwaga{border-left:4px solid #b4322b}\n.mk-licz{font-size:13px;color:#4a4e55}\n.mk-mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:13px}\n.mk ul.mk-lista{list-style:none;display:flex;flex-direction:column;gap:8px}\n.mk ul.mk-lista > li{padding-left:18px;position:relative}\n.mk ul.mk-lista > li::before{content:'';position:absolute;left:0;top:.62em;\n width:7px;height:7px;background:#b4322b;border-radius:1px}\n@media (max-width:520px){.mk-cialo{padding:15px}.mk-glowa{padding:12px 15px}}\n.mk[hidden],.mk [hidden]{display:none!important}\n\n.mk ul.mk-lista.mk-lista-krotka{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 16px}\n.mk-karta{border:1px solid #c9ccc8;border-left:4px solid #16181c;border-radius:3px;background:#fbfbfa;padding:14px 16px}\n.mk-karta > * + *{margin-top:10px}\n.mk-nr{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#4a4e55;font-weight:700}\n.mk-przekaz{font-size:17px;line-height:1.5;font-weight:600}\n.mk-wiersz{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}\n.mk-etyk{font-weight:600}\n.mk-sel{font:inherit;font-size:16px;color:#16181c;background:#fff;border:1px solid #6b7078;border-radius:3px;\n padding:8px 10px;min-height:44px;max-width:100%}\n.mk-sel:focus-visible{outline:3px solid #b4322b;outline-offset:2px}\n.mk-fb{padding:11px 14px;border-radius:3px;background:#fff;border:1px solid #c9ccc8}\n.mk-fb > * + *{margin-top:6px}\n.mk-fb-ok{border-left:4px solid #2c6a4c}\n.mk-fb-nie{border-left:4px solid #b4322b}\n.mk-werd{font-weight:700}\n.mk-fb-ok .mk-werd{color:#245a40}\n.mk-fb-nie .mk-werd{color:#96261f}\n.mk-blok:focus{outline:none}\n";
var D = {"nad": "Ćwiczenie · techniki propagandy", "tytul": "Rozpoznaj technikę", "lid": "Dziesięć krótkich przekazów i dziesięć technik. Przy każdym przekazie wybierz technikę z listy, a potem sprawdź wszystko naraz. Każda technika pasuje do dokładnie jednego przekazu.", "techniki": [["etykieta", "Etykietowanie"], ["ogolniki", "Świetliste ogólniki"], ["transfer", "Transfer"], ["swiadectwo", "Świadectwo znanej osoby"], ["zwykly", "Zwykły człowiek"], ["karty", "Dobieranie kart"], ["ped", "Owczy pęd"], ["odczl", "Odczłowieczenie"], ["sukces", "Propaganda sukcesu"], ["straszak", "Straszak"]], "pozycje": [{"k": "zwykly", "t": "Minister w sobotę na targu: „Sam robię zakupy i liczę każdą złotówkę. Wiem, jak żyją zwykli ludzie”.", "w": "Nadawca przedstawia się jako „jeden z nas”. Wspólne doświadczenie ma budować zaufanie — niezależnie od tego, co minister faktycznie proponuje."}, {"k": "straszak", "t": "„Jeśli nie zatrzymamy tej ustawy, za rok nikt z nas nie będzie bezpieczny we własnym domu”.", "w": "Wyolbrzymione zagrożenie ma skłonić do akceptacji jednej decyzji. Brak konkretów — kto, jak i dlaczego miałby być w niebezpieczeństwie — to typowy sygnał straszaka."}, {"k": "ogolniki", "t": "„Wolność. Nowoczesność. Godność. To nasza odpowiedź na wyzwania jutra”.", "w": "Trzy piękne słowa, pod którymi każdy podpisze się bez wahania — i żadnej informacji, co konkretnie nadawca zamierza zrobić."}, {"k": "odczl", "t": "„Oni nie są tacy jak my. To szarańcza, która pożera wszystko, co zbudowaliśmy”.", "w": "Ludzie zamienieni w owady — to odczłowieczenie w formie animalistycznej. Bez żadnego konkretnego zarzutu cała grupa zostaje odarta z ludzkich cech, a współczucie dla niej zaczyna wyglądać na zbędne."}, {"k": "karty", "t": "Reklama suplementu: „9 na 10 osób w badaniu poczuło więcej energii!”. Reklama nie wspomina, że w badaniu wzięło udział 10 osób i nie było grupy porównawczej.", "w": "Liczba jest prawdziwa, ale wybrana tak, żeby zasłonić słabość badania. Tak działa dobieranie kart: wygodne fakty na wierzchu, niewygodne pod spodem."}, {"k": "swiadectwo", "t": "Reprezentant kraju w siatkówce: „Piję ten napój przed każdym meczem. Skoro mnie daje energię, tobie też da”.", "w": "Popularność sportowca ma zastąpić dowód. Znana osoba poręcza za produkt, choć nic nie wskazuje, że zna się na tym, jak napój działa."}, {"k": "sukces", "t": "„Rekordowy rok! Trzy nowe przedszkola i park wodny. Nasze miasto rośnie w siłę dzięki mądrym rządom”.", "w": "Same osiągnięcia rządzących, zero kosztów i porażek. Z komunikatu nie dowiemy się niczego o długu, zamkniętych placówkach ani o tym, ile kosztował park wodny."}, {"k": "etykieta", "t": "„Nie będziemy dyskutować z oszołomami. Ich projekt ustawy trafi tam, gdzie jego miejsce — do kosza”.", "w": "Zamiast odpowiedzi na argumenty — obraźliwa etykieta. Słowo „oszołom” nie mówi nic o projekcie ustawy, ale zwalnia publiczność z zapoznania się z nim."}, {"k": "ped", "t": "„Już ponad milion osób przeszło na nasz abonament. Na co jeszcze czekasz?”", "w": "Argumentem jest liczba tych, którzy już się zdecydowali. Sugestia „wszyscy tak robią” ma zastąpić odpowiedź na pytanie, czy to się opłaca."}, {"k": "transfer", "t": "Spot kandydatki na burmistrzynię: każde ujęcie na tle zabytkowego ratusza i miejskiej flagi, a w tle hymn miasta.", "w": "Prestiż symboli — ratusza, flagi, hymnu — przenosi się na kandydatkę. Spot nie mówi, co ona zrobi; mówi, z czym ma się kojarzyć."}], "komplet": "Komplet. Zwróć uwagę, że w prawdziwych przekazach techniki rzadko występują pojedynczo — straszak idzie w parze z etykietowaniem, a propaganda sukcesu z dobieraniem kart.", "niekomplet": "Przejrzyj wyjaśnienia przy przekazach, w których wybór się nie zgodził. Niektóre techniki są do siebie podobne: propaganda sukcesu przypomina dobieranie kart, tyle że służy wizerunkowi rządzących."};
function ensure(){
  var w = document.getElementById('mk-techniki') || document.querySelector('.mk-techniki');
  if(!w) return null;
  w.id='mk-techniki'; w.className='mk mk-techniki';
  return w;
}
function stylKiedys(){
  if(document.querySelector('style[data-mk="mk-techniki"]')) return;
  var st=document.createElement('style');
  st.setAttribute('data-mk','mk-techniki');
  st.appendChild(document.createTextNode(CSS));
  (document.head||document.documentElement).appendChild(st);
}
function el(t,k,tx){var e=document.createElement(t); if(k) e.className=k;
  if(tx!==undefined && tx!==null) e.textContent=tx; return e;}
function glowa(root){
  var g=el('div','mk-glowa');
  if(D.nad){var n=el('p','mk-nad',D.nad); g.appendChild(n);}
  g.appendChild(el('h3',null,D.tytul));
  root.appendChild(g);
  var c=el('div','mk-cialo'); root.appendChild(c); return c;
}
function zlecenie(c){
  if(!D.zlecenie) return;
  var z=el('div','mk-zlec');
  z.appendChild(el('p','mk-od', D.zlecenie.od || 'Zlecenie z redakcji'));
  z.appendChild(el('p',null, D.zlecenie.tresc));
  c.appendChild(z);
}

function buduj(c, root){
  var N = D.pozycje.length;
  c.appendChild(el('p','mk-lid', D.lid));

  var leg = el('div','mk-blok');
  leg.appendChild(el('h4', null, 'Techniki do wyboru'));
  var ul = el('ul','mk-lista mk-lista-krotka');
  D.techniki.forEach(function(t){ ul.appendChild(el('li', null, t[1])); });
  leg.appendChild(ul);
  c.appendChild(leg);

  var postep = el('p','mk-licz');
  postep.id = 'mk-postep';
  c.appendChild(postep);

  var selekty = [], fbs = [];
  D.pozycje.forEach(function(p, i){
    var k = el('div','mk-karta');
    var nr = el('p','mk-nr', 'Przekaz ' + (i + 1) + ' z ' + N);
    nr.id = 'mk-nr-' + i;
    var tx = el('p','mk-przekaz', p.t);
    tx.id = 'mk-tx-' + i;
    k.appendChild(nr);
    k.appendChild(tx);
    var wiersz = el('div','mk-wiersz');
    var lab = el('label','mk-etyk','Technika:');
    lab.setAttribute('for', 'mk-s-' + i);
    var s = document.createElement('select');
    s.id = 'mk-s-' + i;
    s.className = 'mk-sel';
    s.setAttribute('aria-describedby', 'mk-nr-' + i + ' mk-tx-' + i);
    var o0 = document.createElement('option');
    o0.value = '';
    o0.textContent = 'wybierz technikę';
    s.appendChild(o0);
    D.techniki.forEach(function(t){
      var o = document.createElement('option');
      o.value = t[0];
      o.textContent = t[1];
      s.appendChild(o);
    });
    s.addEventListener('change', odswiez);
    wiersz.appendChild(lab);
    wiersz.appendChild(s);
    k.appendChild(wiersz);
    var fb = el('div','mk-fb');
    fb.hidden = true;
    k.appendChild(fb);
    c.appendChild(k);
    selekty.push(s);
    fbs.push(fb);
  });

  var btny = el('div','mk-btny');
  var bSpr = el('button','mk-btn','Sprawdź wszystkie');
  bSpr.type = 'button';
  bSpr.setAttribute('aria-describedby','mk-postep');
  var bRes = el('button','mk-btn mk-btn2','Zacznij od nowa');
  bRes.type = 'button';
  btny.appendChild(bSpr);
  btny.appendChild(bRes);
  c.appendChild(btny);
  var glos = el('p','mk-sr');
  glos.setAttribute('role','status');
  c.appendChild(glos);
  var wynik = el('div','mk-blok mk-ok');
  wynik.hidden = true;
  wynik.setAttribute('tabindex','-1');
  c.appendChild(wynik);

  var sprawdzone = false;
  function ileWybranych(){
    var n = 0;
    selekty.forEach(function(s){ if(s.value){ n++; } });
    return n;
  }
  function odswiez(){
    var n = ileWybranych();
    postep.textContent = 'Wybrane: ' + n + ' z ' + N;
    bSpr.setAttribute('aria-disabled', n === N ? 'false' : 'true');
    if(sprawdzone){
      glos.textContent = 'Zmieniono odpowiedź — sprawdź ponownie, żeby zobaczyć aktualny wynik.';
    }
  }
  odswiez();

  bSpr.addEventListener('click', function(){
    if(bSpr.getAttribute('aria-disabled') === 'true'){
      var brak = null;
      for(var j = 0; j < selekty.length; j++){ if(!selekty[j].value){ brak = selekty[j]; break; } }
      glos.textContent = 'Nie można jeszcze sprawdzić: brakuje odpowiedzi przy ' + (N - ileWybranych()) +
        ' przekazach. Przenoszę kursor do pierwszego z nich.';
      if(brak){ brak.focus(); }
      return;
    }
    var traf = 0;
    D.pozycje.forEach(function(p, i){
      var ok = (selekty[i].value === p.k);
      if(ok){ traf++; }
      var nazwa = '';
      D.techniki.forEach(function(t){ if(t[0] === p.k){ nazwa = t[1]; } });
      var fb = fbs[i];
      fb.innerHTML = '';
      fb.hidden = false;
      fb.className = 'mk-fb ' + (ok ? 'mk-fb-ok' : 'mk-fb-nie');
      fb.appendChild(el('p','mk-werd', ok ? ('Trafnie: ' + nazwa + '.') : ('Tu działa: ' + nazwa + '.')));
      fb.appendChild(el('p', null, p.w));
    });
    sprawdzone = true;
    glos.textContent = '';
    wynik.innerHTML = '';
    wynik.hidden = false;
    wynik.appendChild(el('h4', null, 'Zgodne wybory: ' + traf + ' z ' + N));
    wynik.appendChild(el('p', null, traf === N ? D.komplet : D.niekomplet));
    wynik.focus();
  });

  bRes.addEventListener('click', function(){
    selekty.forEach(function(s){ s.value = ''; });
    fbs.forEach(function(f){ f.hidden = true; f.innerHTML = ''; });
    wynik.hidden = true;
    wynik.innerHTML = '';
    sprawdzone = false;
    glos.textContent = '';
    odswiez();
    selekty[0].focus();
  });
}

function start(){
  var root=ensure();
  if(!root || root.getAttribute('data-mk-init')) return;
  root.setAttribute('data-mk-init','1');
  root.setAttribute('lang','pl');
  stylKiedys();
  root.innerHTML='';
  var c=glowa(root);
  zlecenie(c);
  buduj(c, root);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
else start();
})();
// ]]>
</script>
</main>
</body>
